<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 240 240" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>ExolveNet logo</title>
